name: Prepare artist catalogue update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artist-catalogue-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run test:catalogue
      - run: npm run update:artists
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artist-catalogue-candidate
          path: |
            public/assets/artists.json
            reports/artists-update.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: artist-catalogue-failure
          path: reports/artists-update.json
          if-no-files-found: ignore
